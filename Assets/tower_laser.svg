<svg width="226" height="226" viewBox="0 0 226 226" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall -->
  <rect x="43" y="43" width="140" height="140" rx="4" fill="#1E0808" stroke="#FF4444" stroke-width="1.4"/>
  <rect x="52" y="52" width="122" height="122" rx="3" fill="none" stroke="#3A1010" stroke-width="0.8"/>
  <!-- Corner turrets NW -->
  <rect x="37" y="37" width="30" height="30" rx="2" fill="#180606" stroke="#FF4444" stroke-width="1"/>
  <circle cx="52" cy="52" r="8" fill="#100404" stroke="#FF4444" stroke-width="0.8"/>
  <circle cx="52" cy="52" r="3" fill="#FF4444" opacity="0.5"/>
  <!-- NE -->
  <rect x="159" y="37" width="30" height="30" rx="2" fill="#180606" stroke="#FF4444" stroke-width="1"/>
  <circle cx="174" cy="52" r="8" fill="#100404" stroke="#FF4444" stroke-width="0.8"/>
  <circle cx="174" cy="52" r="3" fill="#FF4444" opacity="0.5"/>
  <!-- SW -->
  <rect x="37" y="159" width="30" height="30" rx="2" fill="#180606" stroke="#FF4444" stroke-width="1"/>
  <circle cx="52" cy="174" r="8" fill="#100404" stroke="#FF4444" stroke-width="0.8"/>
  <circle cx="52" cy="174" r="3" fill="#FF4444" opacity="0.5"/>
  <!-- SE -->
  <rect x="159" y="159" width="30" height="30" rx="2" fill="#180606" stroke="#FF4444" stroke-width="1"/>
  <circle cx="174" cy="174" r="8" fill="#100404" stroke="#FF4444" stroke-width="0.8"/>
  <circle cx="174" cy="174" r="3" fill="#FF4444" opacity="0.5"/>
  <!-- Courtyard -->
  <rect x="73" y="73" width="80" height="80" rx="3" fill="#0C0404" stroke="#3A1010" stroke-width="0.8"/>
