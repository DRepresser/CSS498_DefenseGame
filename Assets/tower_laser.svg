  <line x1="112" y1="38" x2="109" y2="22" stroke="#FF4444" stroke-width="0.4" opacity="0.2"/>
  <line x1="114" y1="38" x2="117" y2="22" stroke="#FF4444" stroke-width="0.4" opacity="0.2"/>
  <!-- Beam tip -->
  <circle cx="113" cy="15" r="3" fill="#FF4444" opacity="0.5"/>
  <circle cx="113" cy="15" r="1.5" fill="#FFDDDD" opacity="0.9"/>
  <!-- Core -->
  <circle cx="113" cy="118" r="5" fill="#FF4444" opacity="0.35"/>
  <circle cx="113" cy="118" r="2" fill="#FFAAAA" opacity="0.85"/>
